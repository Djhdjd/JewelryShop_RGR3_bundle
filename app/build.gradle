import org.gradle.api.tasks.testing.Test
import org.gradle.testing.jacoco.tasks.JacocoReport
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification

plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'io.gitlab.arturbosch.detekt'
 id 'jacoco'
}
android {
 namespace 'com.example.jewelryshop'
 compileSdk 35
 defaultConfig {
  applicationId 'com.example.jewelryshop'
  minSdk 24
  targetSdk 35
  versionCode 4
  versionName '3.1-rgr3'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  testInstrumentationRunnerArguments clearPackageData: 'true'
  javaCompileOptions { annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas"] } }
 }
 buildFeatures { buildConfig true }
 buildTypes {
  debug { enableUnitTestCoverage true; enableAndroidTestCoverage true }
  release { minifyEnabled false }
  benchmark { initWith release; debuggable false; signingConfig signingConfigs.debug; matchingFallbacks = ['release'] }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 testOptions { unitTests.includeAndroidResources = true; execution 'ANDROIDX_TEST_ORCHESTRATOR'; animationsDisabled true }
 packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
// Robolectric's resolver is separate from the Gradle dependency resolver.
tasks.withType(Test).configureEach {
 systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
 systemProperty 'robolectric.dependency.repo.id', 'central'
}
jacoco { toolVersion = '0.8.13' }
detekt { buildUponDefaultConfig = false; allRules = false; config.setFrom(files("${rootProject.projectDir}/config/detekt/detekt.yml")); source.setFrom(files('src/main/java')) }
dependencies {
 implementation 'androidx.room:room-runtime:2.7.1'
 annotationProcessor 'androidx.room:room-compiler:2.7.1'
 implementation 'androidx.annotation:annotation:1.9.1'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.code.gson:gson:2.11.0'
 implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
 debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.mockito:mockito-core:5.15.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'androidx.test:core:1.6.1'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
 androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
 androidTestImplementation 'androidx.room:room-testing:2.7.1'
 androidTestUtil 'androidx.test:orchestrator:1.5.1'
}
def domainClasses = files(fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) { include 'com/example/jewelryshop/domain/**/*.class' })
def unitCoverage = fileTree(layout.buildDirectory) { include 'jacoco/testDebugUnitTest.exec', 'outputs/unit_test_code_coverage/**/testDebugUnitTest.exec' }
def deviceCoverage = fileTree(layout.buildDirectory) { include 'outputs/code_coverage/**/connected/**/*.ec', 'outputs/code_coverage/**/connected/**/*.exec' }
tasks.register('rgr3CoverageReport', JacocoReport) {
 dependsOn 'testDebugUnitTest'
 classDirectories.setFrom(domainClasses); sourceDirectories.setFrom(files('src/main/java')); executionData.setFrom(unitCoverage)
 reports { xml.required = true; html.required = true; csv.required = true; html.outputLocation = layout.buildDirectory.dir('reports/jacoco/rgr3'); xml.outputLocation = layout.buildDirectory.file('reports/jacoco/rgr3/report.xml') }
 doFirst { if (domainClasses.asFileTree.files.isEmpty() || unitCoverage.isEmpty()) throw new GradleException('Missing compiled domain classes or unit coverage data') }
}
tasks.register('rgr3CoverageVerify', JacocoCoverageVerification) {
 dependsOn 'rgr3CoverageReport'
 classDirectories.setFrom(domainClasses); sourceDirectories.setFrom(files('src/main/java')); executionData.setFrom(unitCoverage)
 violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = new BigDecimal('0.70') } } }
}
tasks.register('rgr3CombinedCoverageReport', JacocoReport) {
 dependsOn 'testDebugUnitTest'
 classDirectories.setFrom(domainClasses); sourceDirectories.setFrom(files('src/main/java')); executionData.setFrom(unitCoverage, deviceCoverage)
 reports { xml.required = true; html.required = true; html.outputLocation = layout.buildDirectory.dir('reports/jacoco/rgr3-combined') }
 doFirst { if (deviceCoverage.isEmpty()) throw new GradleException('Run connectedDebugAndroidTest first; device coverage missing') }
}
